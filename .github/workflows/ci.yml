name: ci

# gofmt, go vet and go test, with a Mailpit service for the integration test. Pull requests toward develop and qa only. No schedule.
on:
  pull_request:
    branches: [develop, qa]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mailpit:
        image: axllent/mailpit:v1.21.8
        ports:
          - 1025:1025
          - 8025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
        env:
          MAILPIT_SMTP: 127.0.0.1:1025
          MAILPIT_URL: http://127.0.0.1:8025
      # The compose file must be valid; nothing starts
      - name: compose config
        run: docker compose -f deploy/compose.yml config -q
        env:
          SMTP_HOST: mailpit
          SMTP_PORT: "1025"
          SMTP_FROM: no-reply@multitour.local
      # Catches a base image tag that does not exist; nothing is pushed
      - name: docker build
        run: docker build -f deploy/Dockerfile .
